  </g>
  <text x="60" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ASCEND</text>
  <text x="60" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#fce7f3" text-anchor="middle" letter-spacing="1">2025 &middot; LEADERSHIP</text>
