<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <defs>
    <linearGradient id="cert-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="120" height="100" rx="12" fill="url(#cert-bg)"/>
  <!-- Diploma scroll icon -->
  <g fill="#ffffff" transform="translate(60, 32)">
    <rect x="-16" y="-12" width="32" height="22" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="-10" y1="-5" x2="10" y2="-5" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="-10" y1="5" x2="2" y2="5" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Ribbon -->
    <circle cx="8" cy="8" r="4" fill="#f59e0b"/>
  </g>
  <text x="60" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">CERTIFICATE</text>
  <text x="60" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#ddd6fe" text-anchor="middle" letter-spacing="0.5">COMPLETION</text>
</svg>